[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri"]
default-members = ["apps/desktop/src-tauri"]
exclude = ["legacy/prototype"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/ehartford/QuixiChat"

[workspace.dependencies]
tauri = "=2.11.5"
tauri-build = "2.6"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
