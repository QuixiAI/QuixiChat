[package]
name = "quixi-chat-kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
metal = ["burn/metal"]
metal-kernels = ["metal", "dep:burn-wgpu", "dep:cubecl", "dep:cubecl-cpp"]
test-cpu = ["burn/ndarray"]

[dependencies]
burn.workspace = true
burn-wgpu = { version = "=0.21.0", default-features = false, features = ["metal", "std"], optional = true }
cubecl = { version = "=0.10.0", default-features = false, features = ["metal", "std"], optional = true }
cubecl-cpp = { version = "=0.10.0", default-features = false, features = ["metal", "std"], optional = true }
half.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
burn = { workspace = true, features = ["metal"] }
cubecl-common = "=0.10.0"

[lints]
workspace = true
