server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # No callback query strings in this origin's access or error logs.
    # An upstream proxy must apply the same query-redaction policy.
    location = /oauth/callback.html {
        access_log off;
        error_log /dev/null;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # A missing model must be a 404, not the application document: the
    # browser classifies HTTP 404 as "model unavailable" and would otherwise
    # report a digest mismatch on the HTML fallback.
    location /models/ {
        try_files $uri =404;
    }
}
